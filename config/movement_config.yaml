# Movement Detection Configuration

# State machine
states: ["STATIONARY", "MOVEMENT_SUSPECTED", "MOVING", "UNCERTAIN"]

# Hysteresis — how many consecutive frames of motion evidence before transitioning
frames_to_suspect: 2        # STATIONARY → MOVEMENT_SUSPECTED after N frames of motion
frames_to_confirm: 5        # MOVEMENT_SUSPECTED → MOVING after N frames of sustained motion
frames_to_clear: 10         # MOVING → STATIONARY after N frames of no motion

# Position change threshold (in pixels) to count as "motion detected"
position_change_threshold_px: 15

# Depth-based distance change threshold (in meters) — if depth is available
distance_change_threshold_m: 0.5

# Missing asset detection (temporal hysteresis — avoids false alarms from occlusion)
missing_alert_threshold: 3  # Number of consecutive patrol cycles an asset must be absent
                             # before ASSET_MISSING alert fires. At 5 FPS and ~10 frames/cycle
                             # this means ~6 seconds of continuous absence.

# 3-metre displacement alert threshold (site map coordinates, after map projection)
displacement_alert_threshold_m: 3.0

# Ego-motion compensation
ego_motion_enabled: true  # Requires robot pose data from ROS engineer
