# ReID Configuration
# Used from Week 3 onwards

# Backbone model
backbone: "osnet_x1_0"  # osnet_x1_0 | osnet_x0_75 | resnet50_ibn
model_path: "models/reid/reid_backbone_best.onnx"
model_format: "onnx"
embedding_dim: 512

# Matching
similarity_metric: "cosine"  # cosine | euclidean
max_candidates: 5  # Return top-N candidates

# Confidence thresholds — calibrated for multi-asset site patrol
thresholds:
  t_high: 0.70       # Score >= t_high AND margin >= t_margin → CONFIRMED
  t_low: 0.60        # Score >= t_low but < t_high → PROBABLE
  t_margin: 0.005    # Fine-grained margin (0.5% separation between top-1 and top-2)
  t_min: 0.45        # Score below this → UNKNOWN (no match)

# Multi-view references
max_references_per_asset: 10  # Store up to N reference images per asset
embedding_aggregation: "max"  # Nearest-neighbour matching across stored views
